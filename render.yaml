services:
  - type: web
    name: media-monitoring-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate:prod && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: media-monitoring-db
          property: connectionString
      - key: INGEST_API_KEY
        generateValue: true

databases:
  - name: media-monitoring-db
    plan: free
